input {
  # Recevoir les logs des conteneurs Docker via Filebeat
  beats {
    port => 5044
  }

  # TCP input pour les logs Express du backend
  tcp {
    port => 5000
    codec => json_lines
    type => "backend-logs"
  }
}

filter {
  # Traiter les logs du backend
  if [type] == "backend-logs" {
    json {
      source => "message"
      target => "parsed"
    }
    mutate {
      add_field => { "source_type" => "backend" }
    }
  }

  # Traiter les logs Docker (de Filebeat)
  else if [type] == "container" {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
    mutate {
      add_field => { "source_type" => "container" }
    }
  }

  # Nettoyer et normaliser
  mutate {
    remove_field => ["@version", "host"]
  }

  # Utiliser le timestamp du log s'il existe
  if [@timestamp] {
    date {
      match => ["@timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  # Affichage en console pour debug
  stdout {
    codec => rubydebug
  }

  # Envoyer tous les logs vers Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "transcendence-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }
}
